services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_akademik
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_referensi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: data-referensi-be
    image: data-referensi-be:${COUNTER:-latest}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: ./main

volumes:
  postgres_data:
